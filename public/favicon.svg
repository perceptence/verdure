<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Verdure">
  <!-- Verdure mark. Redrawn from the splash-screen logo with heavier strokes and
       no hairline ring, so it still reads at 16px in a browser tab. -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E5C43"/>
      <stop offset="1" stop-color="#16241A"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#v)"/>

  <!-- stem -->
  <path d="M48 73V41" stroke="#EAF0E4" stroke-width="7" stroke-linecap="round"/>
  <!-- lower-left leaf -->
  <path d="M48 55C48 42.5 40.5 34 27 31c0 12.5 7.5 21 21 24Z" fill="#7FA968"/>
  <!-- upper-right leaf -->
  <path d="M48 47C48 34.5 55.5 26 69 23c0 12.5-7.5 21-21 24Z" fill="#A9C88C"/>
  <!-- seed -->
  <circle cx="48" cy="75" r="4.5" fill="#EAF0E4"/>
</svg>
